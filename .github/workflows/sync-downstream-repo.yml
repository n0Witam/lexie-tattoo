name: Sync fork after Pages deployment

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
    branches: [main]

jobs:
  sync_fork:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FORK_SYNC_TOKEN }}
          script: |
            await github.request('POST /repos/{owner}/{repo}/merge-upstream', {
              owner: 'netsatan',
              repo: 'lexie-tattoo',
              branch: 'main'
            })
